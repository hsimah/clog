# Include in nginx's http context; set server_name, certificate paths and origin.
limit_req_zone $binary_remote_addr zone=clog_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=clog_api:1m rate=10r/s;
server {
    listen 80;
    server_name clog.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name clog.example.com;
    ssl_certificate /etc/letsencrypt/live/clog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clog.example.com/privkey.pem;
    client_max_body_size 64k;
    limit_req_status 429;
    location ^~ /assets/ {
        alias /opt/clog/client/dist/assets/;
        add_header X-Content-Type-Options nosniff always;
        # stylex.css is not fingerprinted in its filename; retain revalidation.
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /auth/login {
        limit_req zone=clog_login burst=5 nodelay;
        include /etc/nginx/snippets/clog-fastcgi.conf;
    }
    location = /graphql {
        limit_req zone=clog_api burst=20 nodelay;
        include /etc/nginx/snippets/clog-fastcgi.conf;
    }
    location / {
        include /etc/nginx/snippets/clog-fastcgi.conf;
    }
}
