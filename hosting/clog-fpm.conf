[clog]
user = www-data
group = www-data
listen = /run/php/clog.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 30s
catch_workers_output = yes
clear_env = yes
env[CLOG_DB] = /var/lib/clog/clog.sqlite
env[CLOG_SESSION_PATH] = /var/lib/clog/sessions
; Replace with the public HTTPS origin.
env[CLOG_ORIGIN] = https://clog.loft.hsimah.com
php_admin_value[memory_limit] = 64M
php_admin_value[session.save_path] = /var/lib/clog/sessions
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
security.limit_extensions = .php
