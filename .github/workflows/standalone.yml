name: Standalone SQLite
on:
  workflow_dispatch:
  push:
    branches: [feature/standalone-sqlite]
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
          ini-values: opcache.jit=0, opcache.jit_buffer_size=0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: php server/standalone/tests/export-schema.php --check
      - run: npm run relay:check && npm run lint && npm run build
        working-directory: client
      - run: php server/standalone/tests/conformance.php
      - run: php server/standalone/tests/integration.php
      - run: php server/standalone/tests/http.php

      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Browser smoke test
        run: |
          export CLOG_DB=/tmp/clog-browser.sqlite CLOG_ORIGIN=http://127.0.0.1:8280
          php server/standalone/tests/browser-fixture.php
          php -S 127.0.0.1:8280 server/standalone/public/router.php > /tmp/clog-browser.log 2>&1 &
          CLOG_PHP_PID=$!
          trap 'kill "$CLOG_PHP_PID"' EXIT
          cd client
          npx playwright test -c playwright.standalone.config.ts
      - run: scripts/package-standalone.sh
      - run: php server/standalone/tests/package.php
      - uses: actions/upload-artifact@v4
        with:
          name: clog-standalone
          path: build/clog-standalone.tar.gz
