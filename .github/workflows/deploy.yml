name: Package Clog Plugin Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  release-zip:
    uses: ./.github/workflows/release-checks.yml
    with:
      version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  backend:
    uses: ./.github/workflows/backend.yml

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npx tsc -p tsconfig.e2e.json

      - run: npm run lint

      - run: npm run relay:check

      - run: npm run build
        env:
          VITE_GRAPHQL_URL: /graphql

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Teardown previous run
        working-directory: .
        run: docker compose -f .github/workflows/e2e-tests/docker-compose.yml down -v 2>/dev/null || true

      - name: Install PHP dependencies
        working-directory: .
        run: >
          docker run --rm -v "$PWD/server:/app" -u "$(id -u):$(id -g)"
          -e COMPOSER_HOME=/tmp/composer composer:2
          install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Start WordPress stack
        working-directory: .
        run: docker compose -f .github/workflows/e2e-tests/docker-compose.yml up -d --build

      - name: Wait for WordPress setup
        working-directory: .
        run: |
          echo "Waiting for WordPress and plugins..."
          for i in $(seq 1 30); do
            if docker compose -f .github/workflows/e2e-tests/docker-compose.yml exec -T wordpress wp plugin is-active clog --allow-root 2>/dev/null; then
              echo "WordPress is ready and clog plugin is active"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done
          echo "WordPress setup failed"
          docker compose -f .github/workflows/e2e-tests/docker-compose.yml logs wordpress
          exit 1

      - name: Seed test data
        working-directory: .
        run: >
          docker compose -f .github/workflows/e2e-tests/docker-compose.yml
          exec -T wordpress wp clog seed --user=testadmin --allow-root

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build WordPress-served client
        run: npm run build && mkdir -p ../server/dist && cp -r dist/. ../server/dist/

      - name: Run Playwright tests
        env:
          VITE_GRAPHQL_URL: http://localhost:6060/graphql
          WP_ADMIN_USER: testadmin
          WP_ADMIN_PASSWORD: testpassword
        run: npm run test:e2e

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: .
        run: docker compose -f .github/workflows/e2e-tests/docker-compose.yml down -v

  package:
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, backend, release-zip]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clog-plugin
          path: build/
      # Publish the exact ZIP that passed the production install/upgrade checks.
      - name: Attach verified ZIP to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/clog.zip --clobber
