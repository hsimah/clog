name: Package Clog Standalone Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  verify:
    uses: ./.github/workflows/standalone.yml

  package:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clog-standalone
          path: build/
      - name: Attach the verified standalone archive to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/clog-standalone.tar.gz --clobber
