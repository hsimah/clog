entity: Item
description: A thing that can be stocked, identified by its barcode.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Item
    pluralLabel: Items
integrations:
  wpgraphql:
    singular: ClogItem
    plural: ClogItems
storage:
  table: item
  handle: clog_item
fields:
  name:
    type: string
    description: What the item is called.
    required: true
    indexed: true
    maxLength: 200
  barcode:
    type: string
    description: >
      The barcode that identifies this item. One per item: a serialized list could
      not be indexed, and scanning a barcode to find an item is the query this data
      exists to serve.
    nullable: true
    unique: true
    maxLength: 64

queries:
  search:
    description: Stable paginated search with authoritative counts for the app.
    args:
      term: { type: string, nullable: true }
      location: { type: id, nullable: true }
    returns:
      type: Item
      cardinality: many
    integrations:
      wpgraphql:
        field: clogItemSearch
    handler: true
