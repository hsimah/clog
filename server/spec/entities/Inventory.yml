entity: Inventory
description: One stocked instance of an item, in a location.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Inventory Entry
    pluralLabel: Inventory
integrations:
  wpgraphql:
    singular: ClogInventory
    plural: ClogInventoryEntries
storage:
  table: inventory
  handle: clog_inventory
fields:
  name:
    type: string
    description: Display label derived from the item and location before writing.
    maxLength: 200
  dateAdded:
    type: datetime
    description: When this instance entered inventory.
    required: true
edges:
  item:
    to: Item
    cardinality: one
    description: What this entry is an instance of.
    inverse:
      name: inventoryEntries
      unique: false
    onDelete: cascade
    required: true
  location:
    to: Location
    cardinality: one
    description: Where it is kept.
    inverse:
      name: inventoryEntries
      unique: false
    onDelete: restrict
    required: true
sideEffects:
  displayName:
    description: Derive the inventory label from its authoritative item and location.
    on: [create, update]
    phase: preCommit
    handler: true
