entity: Location
description: Somewhere inventory can be kept.
use:
  - ClogPost
integrations:
  graphql:
    singular: ClogLocation
    plural: ClogLocations
storage:
  table: location
  handle: clog_location
fields:
  name:
    type: string
    description: What the location is called.
    required: true
    unique: true
    maxLength: 200

queries:
  search:
    description: Stable paginated search with authoritative counts for the app.
    args:
      term: { type: string, nullable: true }
      item: { type: id, nullable: true }
    returns:
      type: Location
      cardinality: many
    integrations:
      graphql:
        field: clogLocationSearch
    handler: true
