services:
  db:
    extends:
      file: docker-compose.yml
      service: db
  wordpress:
    image: docker.io/library/wordpress:cli-php8.3
    user: "0:0"
    tmpfs:
      - /var/www/html
    environment:
      WP_CLI_ALLOW_ROOT: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../build/clog.zip:/artifacts/clog.zip:ro,z
      - ./:/runner:ro,z
    entrypoint: [sh, /runner/run-release.sh]
