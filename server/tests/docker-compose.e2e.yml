services:
  wordpress:
    environment:
      CLOG_BROWSER_TESTS: "1"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/wp-login.php]
      interval: 2s
      timeout: 5s
      retries: 60
  browser:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /work/clog/client
    volumes:
      - ../../:/work/clog:z
    environment:
      CI: "1"
      VITE_GRAPHQL_URL: http://wordpress:8080/graphql
      WP_ADMIN_USER: clog-test
      WP_ADMIN_PASSWORD: clog-test-password
    depends_on:
      wordpress:
        condition: service_healthy
    command: [sh, -c, 'npm ci && npm run test:e2e']
