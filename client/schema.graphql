schema {
  query: RootQuery
  mutation: RootMutation
}

type RootQuery {
  "One ClogInventory by id."
  clogInventory(id: ID!): ClogInventory

  "One ClogItem by id."
  clogItem(id: ID!): ClogItem

  "One ClogLocation by id."
  clogLocation(id: ID!): ClogLocation

  clogInventoryEntries(first: Int, after: String, last: Int, before: String): RootQueryToClogInventoryConnection
  clogItems(first: Int, after: String, last: Int, before: String): RootQueryToClogItemConnection
  clogLocations(first: Int, after: String, last: Int, before: String): RootQueryToClogLocationConnection
  clogInventorySearch(first: Int, after: String, last: Int, before: String, where: RootQueryToClogInventorySearchConnectionWhereArgs): RootQueryToClogInventorySearchConnection
  clogItemSearch(first: Int, after: String, last: Int, before: String, where: RootQueryToClogItemSearchConnectionWhereArgs): RootQueryToClogItemSearchConnection
  clogLocationSearch(first: Int, after: String, last: Int, before: String, where: RootQueryToClogLocationSearchConnectionWhereArgs): RootQueryToClogLocationSearchConnection
  clogStockedItems(first: Int, after: String, last: Int, before: String, where: RootQueryToClogStockedItemsConnectionWhereArgs): RootQueryToClogStockedItemsConnection
  node(id: ID!): Node
  clogSummary: ClogSummary
}

interface Node {
  id: ID!
}

type RootMutation {
  createClogInventory(input: CreateClogInventoryInput!): CreateClogInventoryPayload
  createClogItem(input: CreateClogItemInput!): CreateClogItemPayload
  createClogLocation(input: CreateClogLocationInput!): CreateClogLocationPayload
  deleteClogInventory(input: DeleteClogInventoryInput!): DeleteClogInventoryPayload
  deleteClogItem(input: DeleteClogItemInput!): DeleteClogItemPayload
  deleteClogLocation(input: DeleteClogLocationInput!): DeleteClogLocationPayload
  updateClogInventory(input: UpdateClogInventoryInput!): UpdateClogInventoryPayload
  updateClogItem(input: UpdateClogItemInput!): UpdateClogItemPayload
  updateClogLocation(input: UpdateClogLocationInput!): UpdateClogLocationPayload
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"One stocked instance of an item, in a location."
type ClogInventory implements Node {
  "The globally unique identifier, opaque and safe to use as a cache key."
  id: ID!

  "The row as storage knows it, unique within its table rather than the schema."
  databaseId: ID!

  ""
  createdAt: String!

  ""
  updatedAt: String!

  "Display label derived from the item and location before writing."
  name: String!

  "When this instance entered inventory."
  dateAdded: String!

  "What this entry is an instance of."
  item: ClogItem

  "Where it is kept."
  location: ClogLocation
}

"A thing that can be stocked, identified by its barcode."
type ClogItem implements Node {
  "The globally unique identifier, opaque and safe to use as a cache key."
  id: ID!

  "The row as storage knows it, unique within its table rather than the schema."
  databaseId: ID!

  ""
  createdAt: String!

  ""
  updatedAt: String!

  "What the item is called."
  name: String!

  """
  The barcode that identifies this item. One per item: a serialized list could not be indexed, and scanning a barcode to find an item is the query this data exists to serve.

  """
  barcode: String

  inventoryEntries(first: Int, after: String, last: Int, before: String): ClogItemToClogInventoryConnection
  stockCount(location: ID): Int!
}

"Somewhere inventory can be kept."
type ClogLocation implements Node {
  "The globally unique identifier, opaque and safe to use as a cache key."
  id: ID!

  "The row as storage knows it, unique within its table rather than the schema."
  databaseId: ID!

  ""
  createdAt: String!

  ""
  updatedAt: String!

  "What the location is called."
  name: String!

  inventoryEntries(first: Int, after: String, last: Int, before: String): ClogLocationToClogInventoryConnection
  stockCount(item: ID): Int!
}

type ClogItemToClogInventoryConnectionEdge {
  cursor: String
  node: ClogInventory
}

type ClogItemToClogInventoryConnection {
  nodes: [ClogInventory]
  edges: [ClogItemToClogInventoryConnectionEdge]
